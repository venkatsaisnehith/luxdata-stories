<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LuxData Stories — Public data from Luxembourg, explained simply. AI-driven insights from data.public.lu datasets.">
    <title>LuxData Stories — Luxembourg Open Data Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="header-content">
            <div class="header-left">
                <h1 class="site-title">LuxData Stories</h1>
                <p class="site-subtitle">Public data from Luxembourg, explained simply</p>
            </div>
            <div class="header-right">
                <span class="pill" id="story-count-pill">0 stories</span>
                <span class="last-updated" id="last-updated">Last updated: —</span>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <nav class="filter-bar" id="filter-bar">
        <div class="filter-bar-content">
            <button class="filter-btn active" data-topic="all" id="filter-all">
                All <span class="badge" id="badge-all">0</span>
            </button>
            <button class="filter-btn" data-topic="housing" id="filter-housing">
                Housing <span class="badge" id="badge-housing">0</span>
            </button>
            <button class="filter-btn" data-topic="employment" id="filter-employment">
                Employment <span class="badge" id="badge-employment">0</span>
            </button>
            <button class="filter-btn" data-topic="transport" id="filter-transport">
                Transport <span class="badge" id="badge-transport">0</span>
            </button>
            <button class="filter-btn" data-topic="environment" id="filter-environment">
                Environment <span class="badge" id="badge-environment">0</span>
            </button>
            <button class="filter-btn" data-topic="economy" id="filter-economy">
                Economy <span class="badge" id="badge-economy">0</span>
            </button>
            <button class="filter-btn" data-topic="health" id="filter-health">
                Health <span class="badge" id="badge-health">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main" id="main-content">
        <div class="stories-grid" id="stories-grid">
            <!-- Story cards rendered by JS -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <div class="empty-icon">📊</div>
            <p>Stories are being generated. Check back in a few minutes.</p>
        </div>

        <!-- Error State -->
        <div class="error-state" id="error-state" style="display: none;">
            <div class="error-icon">🔄</div>
            <p>Data is being refreshed. Check back shortly.</p>
        </div>
    </main>

    <!-- Stats Bar -->
    <footer class="stats-bar" id="stats-bar">
        <div class="stats-bar-content">
            <div class="stat-item" id="stat-stories">
                <span class="stat-value">0</span>
                <span class="stat-label">Stories Generated</span>
            </div>
            <div class="stat-item" id="stat-datasets">
                <span class="stat-value">0</span>
                <span class="stat-label">Datasets Monitored</span>
            </div>
            <div class="stat-item" id="stat-topics">
                <span class="stat-value">0</span>
                <span class="stat-label">Topics Covered</span>
            </div>
            <button class="refresh-btn" id="refresh-btn">
                <span class="refresh-icon">↻</span>
                Refresh Now
            </button>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
